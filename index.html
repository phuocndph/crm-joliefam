  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register Service Worker for PWA - only on production -->
    <script>
      (function() {
        const isProduction = window.location.hostname === 'crm-joliefam.lovable.app';
        
        if ('serviceWorker' in navigator) {
          if (isProduction) {
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('/sw.js')
                .then((registration) => {
                  console.log('SW registered:', registration);
                  registration.update();
                  setInterval(() => registration.update(), 60 * 1000);
                  registration.addEventListener('updatefound', () => {
                    const newWorker = registration.installing;
                    if (newWorker) {
                      newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                          console.log('New SW installed, sending SKIP_WAITING');
                          newWorker.postMessage({ type: 'SKIP_WAITING' });
                        }
                      });
                    }
                  });
                })
                .catch((err) => {
                  console.log('SW registration failed:', err);
                });
            });
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (refreshing) return;
              refreshing = true;
              console.log('New SW active, reloading for latest version...');
              window.location.reload();
            });
          } else {
            navigator.serviceWorker.getRegistrations().then(registrations => {
              registrations.forEach(reg => reg.unregister());
            });
            if ('caches' in window) {
              caches.keys().then(names => names.forEach(name => caches.delete(name)));
            }
          }
        }
      })();
    </script>
  </body>
